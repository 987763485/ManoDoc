    source: brief.md
    text: A3：从打包后的 `.app` 启动（清空 `DULLDOC_PANDOC`/`DULLDOC_TYPST`，不依赖 `tools/` 路径）完成
      Markdown → PDF 与 Markdown → Word，输出有效文件，证明使用内置 sidecar。
    result: passed
    reason:
      text: 隐藏 tools/macos/pandoc 与 tools/macos/typst 后，从 DullDoc.app 启动：Markdown→Word
