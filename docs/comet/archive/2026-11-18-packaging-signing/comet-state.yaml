    source: brief.md
    text: A4：应用内 sidecar 解析顺序为环境变量 → 应用同目录 → 开发目录；把内置 pandoc 移走后转换返回
      `E_PANDOC_MISSING`，恢复后可用，不静默改用系统二进制。
    result: passed
    reason:
      text: engine/sidecar.rs 候选顺序为 DULLDOC_* 环境变量 → 当前可执行文件目录 → 项目
        tools/macos；从应用副本删除 Contents/MacOS/pandoc 并重签后启动，转换返回
        E_PANDOC_MISSING，详情列出 Contents/MacOS/pandoc 等已检查路径，无系统 pandoc
        回退；恢复后转换正常。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：生成 `.dmg`，可挂载，卷内含 `DullDoc.app`，从挂载卷复制出的应用可启动。
