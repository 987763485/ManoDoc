    text: A1：执行打包入口后产出
      `src-tauri/target/release/bundle/macos/DullDoc.app`，`Contents/MacOS/` 内含
      DullDoc 与 pandoc、typst、uv 三个 sidecar，`Contents/Resources` 含前端产物。
