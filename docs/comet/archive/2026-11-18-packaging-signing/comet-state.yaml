        brief“Resources 含前端产物”的表述不同，但应用启动与转换正常；已在 errors/knownLimits 记录该偏差。"
      truncated: false
  - id: A2
    source: brief.md
    text: A2：打包前每个 sidecar 已单独签名；`codesign --verify --deep --strict` 对 `.app`
      通过，`codesign -dv` 显示 `Signature=adhoc`，且 sidecar 的签名不晚于 `.app` 外层签名。
    result: passed
    reason:
      text: sidecar 在打包前由脚本逐个 ad-hoc 签名并 codesign --verify --strict 通过；外层 .app 由 Tauri
        使用 APPLE_SIGNING_IDENTITY="-" 签名。`codesign --verify --deep --strict`
        通过，`codesign -dv` 显示 Signature=adhoc、Sealed Resources version=2
        files=4；签名顺序为 sidecar → .app。
      truncated: false
