<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>引擎调用架构 · ManoDoc</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper: #f4f1e8;
    --color-ink: #23261f;
    --color-muted: #5d6156;
    --color-accent: #2f5d4a;
    --font-sans: 'Geist', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', 'STSong', serif;
    --font-mono: 'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1360px; width: 100%; }
  .diagram-container { width: 100%; overflow-x: auto; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--color-ink);
    margin-bottom: 1.5rem;
  }
  svg { width: 100%; min-width: 1280px; display: block; }
  @media print {
    .diagram-container { overflow-x: visible; }
    svg { min-width: 0; }
  }
  .note {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    color: var(--color-muted);
    margin-top: 0.75rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.4rem;
  }
</style>
</head>
