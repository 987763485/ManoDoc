[package]
name = "dulldoc"
version = "0.1.0"
description = "DullDoc macOS document conversion workbench"
authors = ["DullDoc"]
edition = "2021"
rust-version = "1.99"

[lib]
name = "dulldoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anydoc = "=0.2.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
# 模型下载走 Hugging Face 官方客户端：缓存布局与 xberg 的 OCR 读取路径一致。
lopdf = "0.47"
hf-hub = { version = "=1.0.0", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# 诊断包使用 zip；只启用 deflate，避免额外特性。
zip = { version = "2", default-features = false, features = ["deflate"] }
# 第二内核：xberg 自带 PaddleOCR ONNX 后端；models 由应用显式管理，不在运行时静默下载。
xberg = { version = "=1.4.0", features = ["formats-no-heic", "tokio-runtime", "paddle-ocr-ort"] }
