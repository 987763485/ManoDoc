[package]
name = "dulldoc"
version = "0.1.0"
description = "DullDoc macOS document conversion workbench"
authors = ["DullDoc"]
edition = "2021"
rust-version = "1.99"

[lib]
name = "dulldoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anydoc = "=0.2.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
